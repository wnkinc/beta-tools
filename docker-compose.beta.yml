# =================================================================================
# beta-tools overlay: the incubator's tools composed onto the main mcp-tools stack.
#
# This repo is CLONED INSIDE the main checkout at <mcp-tools>/beta/ (gitignored
# there) -- required, not cosmetic: each image build needs main's ./security in
# its context, and a build context can't span sibling repos. NOTE on paths: in a
# multi-file merge compose resolves every relative path against the PROJECT
# directory (main's repo root), not this file -- hence the beta/ prefixes below
# and the fixed clone location.
#
# Run as a third file on the SAME compose project (volumes keep their names, so
# tool state carries over untouched). Pin it in the root .env so every future
# compose command includes it:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.tunnel.yml:beta/docker-compose.beta.yml
#
# Public posture (auth on, public URLs) is baked in here rather than split into
# a second overlay: this repo exists for one live deployment. Graduating a tool
# to main = move its tools/ dir + compose block + allowlist there, restore the
# 31xx-band egress listener, and drop its ingress route from the override below.
# =================================================================================
services:
  # Extends main's egress wall: the conf.d hook mount is replaced by this repo's
  # snippet (same container target wins), and the beta allowlists ride alongside
  # main's at their own path. Restart egress after changing either.
  egress:
    volumes:
      - ./beta/egress/beta.conf:/etc/squid/conf.d/local.conf:ro
      - ./beta/egress/allowlist:/etc/squid/allowlist-beta:ro

  # xmcp screens untrusted output, so the guardrail must also start with it
  # (profiles lists merge across compose files).
  guardrail:
    profiles: ["xmcp"]

  # This tool screens its output through the guardrail (untrusted external content).
  xmcp:
    build:
      context: .    # the PROJECT dir = main repo root (see the path note above)
      dockerfile: beta/tools/xmcp/Dockerfile
    image: mcp-xmcp
    profiles: ["xmcp"]
    restart: unless-stopped
    env_file:
      - path: beta/tools/xmcp/.env
        required: false
    environment:
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: http
      MCP_AUTH_ENABLED: "1"
      MCP_REQUIRE_APPROVAL: ${MCP_REQUIRE_APPROVAL:-1}
      MCP_UNTRUSTED_OUTPUT: "1"
      MCP_PUBLIC_URL: https://xmcp.${MCP_DOMAIN}
      APPROVAL_PUBLIC_URL: https://approval.${MCP_DOMAIN}
      GUARDRAIL_URL: http://guardrail:8071
      GUARDRAIL_ENABLED: ${GUARDRAIL_ENABLED:-1}
      APPROVAL_URL: http://approval:8072
      HTTPS_PROXY: http://egress:3150
      HTTP_PROXY: http://egress:3150
      NO_PROXY: guardrail,approval,localhost,127.0.0.1
    volumes:
      - xmcp-state:/app/state
    networks:
      - internal

  # Trusted tools: same shape, no guardrail leg (see main's compose for the
  # full commentary on the substrate wiring).
  data:
    build:
      context: .
      dockerfile: beta/tools/data/Dockerfile
    image: mcp-data
    profiles: ["data"]
    restart: unless-stopped
    env_file:
      - path: beta/tools/data/.env
        required: false
    environment:
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: http
      MCP_AUTH_ENABLED: "1"
      MCP_REQUIRE_APPROVAL: ${MCP_REQUIRE_APPROVAL:-1}
      MCP_PUBLIC_URL: https://data.${MCP_DOMAIN}
      APPROVAL_PUBLIC_URL: https://approval.${MCP_DOMAIN}
      APPROVAL_URL: http://approval:8072
      HTTPS_PROXY: http://egress:3151
      HTTP_PROXY: http://egress:3151
      NO_PROXY: approval,localhost,127.0.0.1
      # Where lean-export writes Lean-format files (the volume shared with lean).
      LEAN_DATA_ROOT: /lean-data
    volumes:
      - data-state:/app/state
      - lean-data:/lean-data
    networks:
      - internal

  lean:
    build:
      context: .
      dockerfile: beta/tools/lean/Dockerfile
    image: mcp-lean
    profiles: ["lean"]
    restart: unless-stopped
    env_file:
      - path: beta/tools/lean/.env
        required: false
    environment:
      MCP_HOST: 0.0.0.0
      MCP_TRANSPORT: http
      MCP_AUTH_ENABLED: "1"
      MCP_REQUIRE_APPROVAL: ${MCP_REQUIRE_APPROVAL:-1}
      MCP_PUBLIC_URL: https://lean.${MCP_DOMAIN}
      APPROVAL_PUBLIC_URL: https://approval.${MCP_DOMAIN}
      APPROVAL_URL: http://approval:8072
      HTTPS_PROXY: http://egress:3152
      HTTP_PROXY: http://egress:3152
      NO_PROXY: approval,localhost,127.0.0.1
      # The engine backtests ONLY pipeline data (the volume the data tool exports
      # into) -- never the image's bundled samples.
      LEAN_DATA_FOLDER: /lean-data
    volumes:
      - lean-state:/app/state
      - lean-data:/lean-data
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # inbox-zero: upstream's whole app (github.com/elie222/inbox-zero), run as-is.
  # NOT a substrate tool -- it serves its own /mcp with its own OAuth, so none of
  # the auth/approval/guardrail/egress wiring applies. It lives on its own plain
  # network (direct internet: Gmail API, Pub/Sub push target, Claude) and never
  # touches `internal`; cloudflared joins that network to reach the web app.
  # Services mirror upstream's docker-compose.yml (web, worker, cron, db, redis,
  # serverless-redis-http) with the unused cron jobs dropped.
  # ---------------------------------------------------------------------------
  cloudflared:
    networks:
      - inboxzero

  inbox-zero:
    build:
      context: beta/tools/inbox-zero
    image: mcp-inbox-zero
    profiles: ["inbox-zero"]
    restart: unless-stopped
    # Same-profile dependency (unlike the cross-profile tools above): start.sh runs
    # the Prisma migrations once at boot and carries on if the db isn't up yet.
    depends_on:
      inbox-zero-db:
        condition: service_healthy
    env_file: &inbox-zero-env
      - path: beta/tools/inbox-zero/.env
        required: false
    # Docker's embedded resolver flaked here (EAI_AGAIN on cold lookups broke the
    # Google token exchange at sign-in); resolve upstream directly instead.
    dns: &inbox-zero-dns [1.1.1.1, 8.8.8.8]
    environment: &inbox-zero-environment
      NEXT_PUBLIC_BASE_URL: https://inbox.${MCP_DOMAIN}
      NEXT_PUBLIC_BYPASS_PREMIUM_CHECKS: "true"
      NEXT_PUBLIC_EXTERNAL_API_ENABLED: "true"
      MCP_SERVER_ENABLED: "true"
      DATABASE_URL: postgresql://postgres:postgres@inbox-zero-db:5432/inboxzero?schema=public
      DIRECT_URL: postgresql://postgres:postgres@inbox-zero-db:5432/inboxzero?schema=public
      REDIS_URL: redis://inbox-zero-redis:6379
      REDIS_HTTP_URL: http://inbox-zero-redis-http:80
      QUEUE_BACKEND: bullmq
      INTERNAL_API_URL: http://inbox-zero:3000
      # The rules engine runs on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN
      # in .env) through the provider package the Dockerfile adds.
      CLI_LLM_ENABLED: "true"
      DEFAULT_LLMS: claude-code:sonnet
    networks:
      - inboxzero

  # Pulls BullMQ jobs from redis and forwards them to the web app.
  inbox-zero-worker:
    image: mcp-inbox-zero
    profiles: ["inbox-zero"]
    restart: unless-stopped
    command: ["/app/docker/scripts/start-worker.sh"]
    env_file: *inbox-zero-env
    dns: *inbox-zero-dns
    environment: *inbox-zero-environment
    networks:
      - inboxzero

  # Upstream's interval loops (no cron daemon). watch/all re-arms the Gmail
  # Pub/Sub watch, which Google expires after 7 days -- the one that matters.
  inbox-zero-cron:
    image: curlimages/curl:8.16.0
    profiles: ["inbox-zero"]
    restart: unless-stopped
    env_file: *inbox-zero-env
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -s -o /dev/null http://inbox-zero:3000; do sleep 5; done
        hit() { while true; do curl -s -o /dev/null -w "[cron] $$1 %{http_code}\n" -H "Authorization: Bearer $$CRON_SECRET" "http://inbox-zero:3000$$1"; sleep $$2; done; }
        hit /api/cron/scheduled-actions 900 &
        hit /api/cron/automation-jobs 900 &
        hit /api/follow-up-reminders 3600 &
        hit /api/watch/all 21600 &
        wait
    networks:
      - inboxzero

  inbox-zero-db:
    image: postgres:16
    profiles: ["inbox-zero"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # reachable only on the inboxzero network
      POSTGRES_DB: inboxzero
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - inbox-zero-db:/var/lib/postgresql/data
    networks:
      - inboxzero

  inbox-zero-redis:
    image: redis:7
    profiles: ["inbox-zero"]
    restart: unless-stopped
    volumes:
      - inbox-zero-redis:/data
    networks:
      - inboxzero

  # The app talks Upstash-style HTTP to redis; this is upstream's local stand-in.
  inbox-zero-redis-http:
    image: hiett/serverless-redis-http:0.0.10
    profiles: ["inbox-zero"]
    restart: unless-stopped
    env_file: *inbox-zero-env
    environment:
      SRH_MODE: env
      SRH_CONNECTION_STRING: redis://inbox-zero-redis:6379
    networks:
      - inboxzero

# Ingress: compose REPLACES config content on override (no merge), so this is the
# full route list -- main's routes verbatim plus the three beta hostnames. The one
# accepted duplication in the split: if main's routes change, update this copy
# (drift fails visibly as a 502 on the affected subdomain).
configs:
  cloudflared-config:
    content: |
      tunnel: ${TUNNEL_ID:?set TUNNEL_ID in the root .env (cp env.example .env)}
      credentials-file: /etc/cloudflared/creds.json

      # Each MCP server does its OWN Google OAuth (no Cloudflare Access policy here).
      ingress:
        - hostname: xmcp.${MCP_DOMAIN:?set MCP_DOMAIN in the root .env (cp env.example .env)}
          service: http://xmcp:8061
        - hostname: data.${MCP_DOMAIN}
          service: http://data:8062
        - hostname: lean.${MCP_DOMAIN}
          service: http://lean:8064
        # Whole app: Google sign-in callbacks, the Pub/Sub push webhook, and /mcp.
        - hostname: inbox.${MCP_DOMAIN}
          service: http://inbox-zero:3000
        - hostname: telegram.${MCP_DOMAIN}
          service: http://telegram:8063
        - hostname: gatekeeper.${MCP_DOMAIN}
          service: http://gatekeeper:8065
        - hostname: workspace.${MCP_DOMAIN}
          service: http://workspace:8066
        # browser-view BEFORE browser: the stack validator keys routes by service
        # name and reads the LAST match as the tool's MCP endpoint.
        - hostname: browser-view.${MCP_DOMAIN}
          service: http://browser:6080
        - hostname: browser.${MCP_DOMAIN}
          service: http://browser:8067
        # The approval sidecar's human-facing paths only (tokens are the credential).
        - hostname: approval.${MCP_DOMAIN}
          path: ^/(approve|manage)/.+
          service: http://approval:8072
        - hostname: approval.${MCP_DOMAIN}
          path: ^/(slack|discord|telegram)/interact$
          service: http://approval:8072

        # Everything else is refused.
        - service: http_status:404

# Same names as the volumes these tools used when they lived in main; same compose
# project => same underlying volumes, so state (the lake, backtests, OAuth) carries
# over with no migration. lean-data is the artifact plane between data (writer:
# lean-export) and lean (reader: the engine), shared via the 'leandata' group both
# Dockerfiles create.
volumes:
  xmcp-state:
  data-state:
  lean-state:
  lean-data:
  inbox-zero-db:
  inbox-zero-redis:

networks:
  inboxzero: {}
