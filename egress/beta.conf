# beta-tools egress extension -- mounted over the stack's conf.d hook
# (/etc/squid/conf.d/local.conf), which squid.compose.conf includes BEFORE its
# final deny-all, so these allows participate in the same fail-closed policy.
# Same per-tool scoping as the main conf: one listener per tool, each mapped to
# its own allowlist via `myportname`. The beta port band (3150+) never overlaps
# main's listeners, so a tool graduating back to main can't collide here.
# Allowlists mount at /etc/squid/allowlist-beta (the beta repo's egress/allowlist/).

http_port 3150 name=beta-x-mcp
http_port 3151 name=beta-data
http_port 3152 name=beta-lean

acl beta_port_x_mcp myportname beta-x-mcp
acl beta_dom_x_mcp  dstdomain "/etc/squid/allowlist-beta/x-mcp.txt"
acl beta_port_data  myportname beta-data
acl beta_dom_data   dstdomain "/etc/squid/allowlist-beta/data.txt"
acl beta_port_lean  myportname beta-lean
acl beta_dom_lean   dstdomain "/etc/squid/allowlist-beta/lean.txt"

# CONNECT-only + 443-only are enforced globally by the including conf.
http_access allow beta_port_x_mcp CONNECT beta_dom_x_mcp
http_access allow beta_port_data  CONNECT beta_dom_data
http_access allow beta_port_lean  CONNECT beta_dom_lean
